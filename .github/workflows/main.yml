name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Скачивание кода репозитория
        uses: actions/checkout@v4

      - name: Установка JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Установка Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Сборка APK (Debug)
        run: |
          if [ ! -f "settings.gradle" ]; then
            SUBDIR=$(find . -maxdepth 2 -name "settings.gradle" -printf "%h\n" | head -n 1)
            if [ -n "$SUBDIR" ]; then
              cd "$SUBDIR"
            fi
          fi
          gradle assembleDebug --no-daemon

      - name: Выгрузка готового APK в Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: YT-Playlists-APK
          path: "**/app/build/outputs/apk/debug/app-debug.apk"
